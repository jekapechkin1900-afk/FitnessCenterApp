<div *ngIf="isLoading; else content" class="loading-spinner">
  <mat-spinner></mat-spinner>
</div>

<ng-template #content>
  <div class="dashboard-grid">
    <mat-card *ngFor="let item of analyticsResults | keyvalue" class="metric-card">
      <mat-card-header>
        <mat-card-title>{{ item.key }}</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <div class="metric-value">
          {{ item.value }}
        </div>
      </mat-card-content>
    </mat-card>

    <mat-card class="metric-card">
      <mat-card-header>
        <mat-card-title>Посещения за период</mat-card-title>
      </mat-card-header>
      <mat-card-content class="period-card-content">
        <mat-form-field appearance="outline">
          <mat-label>Выберите диапазон дат</mat-label>
          <mat-date-range-input [formGroup]="range" [rangePicker]="picker">
            <input matStartDate formControlName="start" placeholder="Начало">
            <input matEndDate formControlName="end" placeholder="Конец">
          </mat-date-range-input>
          <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
          <mat-date-range-picker #picker></mat-date-range-picker>
        </mat-form-field>

        <button mat-flat-button color="primary" [disabled]="range.invalid || isLoadingVisits" (click)="calculateVisits()">
          Посчитать
        </button>

        <div class="period-result">
          <mat-spinner *ngIf="isLoadingVisits" diameter="40"></mat-spinner>
          <div *ngIf="totalVisitsInPeriod !== null" class="metric-value">
            {{ totalVisitsInPeriod }}
          </div>
        </div>
      </mat-card-content>
    </mat-card>
  </div>
</ng-template>
