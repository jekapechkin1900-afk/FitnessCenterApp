<div class="container">
  <div class="toolbar">
    <button mat-flat-button color="primary" (click)="openMembershipDialog()">
      <mat-icon>add_card</mat-icon>
      Выдать абонемент
    </button>
    <button mat-flat-button color="accent" [disabled]="selection.selected.length !== 1" (click)="editSelectedMembership()">
      <mat-icon>edit</mat-icon>
      Редактировать
    </button>
    <button mat-flat-button color="warn" [disabled]="selection.isEmpty()" (click)="deleteSelectedMemberships()">
      <mat-icon>delete_sweep</mat-icon>
      Удалить выбранные ({{selection.selected.length}})
    </button>
  </div>

  <div class="table-container mat-elevation-z8">
    <table mat-table [dataSource]="dataSource" matSort>
      <ng-container matColumnDef="select">
        <th mat-header-cell *matHeaderCellDef>
          <mat-checkbox (change)="$event ? masterToggle() : null"
                        [checked]="selection.hasValue() && isAllSelected()"
                        [indeterminate]="selection.hasValue() && !isAllSelected()">
          </mat-checkbox>
        </th>
        <td mat-cell *matCellDef="let row">
          <mat-checkbox (click)="$event.stopPropagation()"
                        (change)="$event ? selection.toggle(row) : null"
                        [checked]="selection.isSelected(row)">
          </mat-checkbox>
        </td>
      </ng-container>
      <ng-container matColumnDef="clientName">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Клиент </th>
        <td mat-cell *matCellDef="let element"> {{element.clientName}} </td>
      </ng-container>
      <ng-container matColumnDef="type">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Тип </th>
        <td mat-cell *matCellDef="let element"> {{element.type}} </td>
      </ng-container>
      <ng-container matColumnDef="price">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Цена </th>
        <td mat-cell *matCellDef="let element"> {{element.price | currency:'RUB':'symbol-narrow'}} </td>
      </ng-container>
      <ng-container matColumnDef="startDate">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Начало </th>
        <td mat-cell *matCellDef="let element"> {{element.startDate | date:'dd.MM.yyyy'}} </td>
      </ng-container>
      <ng-container matColumnDef="endDate">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Конец </th>
        <td mat-cell *matCellDef="let element"> {{element.endDate | date:'dd.MM.yyyy'}} </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="selection.toggle(row)" class="clickable-row"></tr>
    </table>
  </div>
</div>
