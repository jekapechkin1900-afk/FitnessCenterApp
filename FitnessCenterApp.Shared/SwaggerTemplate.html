<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>API - {{ServiceName}}</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            background-color: #fafafa;
        }

        header {
            background-color: #4CAF50;
            color: white;
            padding: 20px;
            text-align: center;
        }

        h1, h2 {
            margin: 0;
        }

        main {
            padding: 20px;
            max-width: 900px;
            margin: auto;
        }

        .endpoint {
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .endpoint-header {
            padding: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 15px;
        }

            .endpoint-header:hover {
                background-color: #f1f1f1;
            }

        .method {
            font-weight: bold;
            padding: 5px 10px;
            border-radius: 3px;
            color: white;
        }

        .get {
            background-color: #2196F3;
        }

        .post {
            background-color: #4CAF50;
        }

        .put {
            background-color: #ff9800;
        }

        .delete {
            background-color: #f44336;
        }

        .path {
            font-family: "Courier New", Courier, monospace;
            font-size: 1.1em;
        }

        .endpoint-body {
            padding: 0 20px 20px 20px;
            display: none;
        }

        textarea {
            width: 95%;
            min-height: 100px;
            margin-top: 10px;
            padding: 10px;
            font-family: monospace;
        }

        button {
            padding: 10px 15px;
            background: #2196F3;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
        }

        pre {
            background-color: #2d2d2d;
            color: #ccc;
            padding: 15px;
            border-radius: 5px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
    </style>
</head>
<body>
    <header>
        <h1>{{ServiceName}}</h1>
        <h2>Порт: {{ServicePort}}</h2>
    </header>
    <main>
        {{Endpoints}}
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.endpoint-header').forEach(header => {
                header.addEventListener('click', () => {
                    const body = header.nextElementSibling;
                    body.style.display = body.style.display === 'block' ? 'none' : 'block';
                });
            });

            document.querySelectorAll('.try-it-out').forEach(button => {
                button.addEventListener('click', async (e) => {
                    e.stopPropagation();

                    const endpointDiv = button.closest('.endpoint');
                    const method = button.dataset.method;
                    let path = endpointDiv.querySelector('.path').textContent;
                    const pathParamInput = endpointDiv.querySelector('.path-param');
                    const bodyTextarea = endpointDiv.querySelector('.body-textarea');
                    const resultPre = endpointDiv.querySelector('.result-pre');

                    if (pathParamInput && pathParamInput.value) {
                        path = path.replace('{id}', pathParamInput.value);
                    }

                    resultPre.textContent = 'Выполнение запроса...';

                    try {
                        const options = {
                            method: method,
                            headers: { 'Content-Type': 'application/json' },
                        };
                        if (bodyTextarea && (method === 'POST' || method === 'PUT')) {
                            options.body = bodyTextarea.value;
                        }

                        const response = await fetch(path, options);
                        let resultText = `Статус: ${response.status} ${response.statusText}\n\n`;

                        const contentType = response.headers.get("content-type");
                        if (response.status === 204) {
                            resultText += "(No Content)";
                        } else if (contentType && contentType.indexOf("application/json") !== -1) {
                            const responseData = await response.json();
                            resultText += JSON.stringify(responseData, null, 2);
                        } else {
                            resultText += await response.text();
                        }

                        resultPre.textContent = resultText;
                    } catch (error) {
                        resultPre.textContent = 'Ошибка: ' + error.message;
                    }
                });
            });
        });
    </script>
</body>
</html>
